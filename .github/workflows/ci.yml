name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ios:
    name: iOS App & Swift Testing
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions on runner:"
          ls -d /Applications/Xcode* || true
          
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('apps/SplitBill/**/*.swift', 'apps/SplitBill/**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run Verification Pipeline
        env:
          CI: "true"
        run: |
          ./scripts/verify.sh

      - name: Publish Step Summary
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### 🧾 SplitBill iOS CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`$GH_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`$GH_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: \`$GH_EVENT\`" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- **Status**: ✅ All architecture boundaries respected & Swift Testing suite passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ❌ iOS Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          fi

  verify-backend:
    name: Backend API & Jest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Backend
        run: npm run build

      - name: Run Backend Tests
        run: npm test

      - name: Publish Backend Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### 🌐 SplitBill Backend API CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: \`ubuntu-latest\`" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- **Status**: ✅ NestJS build & 99 Jest / Fast-Check tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ❌ Backend Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          fi
