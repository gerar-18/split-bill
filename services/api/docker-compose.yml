services:
  db:
    image: postgres:16-alpine
    container_name: splitbill-postgres
    restart: always
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: splitbill_secret_password
      POSTGRES_DB: splitbill_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbill -d splitbill_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitbill-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://splitbill:splitbill_secret_password@db:5432/splitbill_db?schema=public
      JWT_SECRET: dev_jwt_secret_splitbill_2026
      AI_PROVIDER: heuristic-fallback
      DEEPSEEK_API_KEY: ""
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AI_RATE_LIMIT_MAX: "20"
      AI_FALLBACK_ON_ERROR: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data:
